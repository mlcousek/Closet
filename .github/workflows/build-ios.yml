name: Build iOS

# Produces unsigned .ipa files for sideloading with AltStore, which signs them
# on install. The repository is public, so macOS runner minutes are free: every
# push builds the release app, and a version tag or a manual run can build the
# development client as well.
on:
  workflow_dispatch:
    inputs:
      variant:
        description: Which build to produce
        type: choice
        default: both
        options: [both, release, development]
  push:
    branches: ['**']
    tags: ['v*']
    paths-ignore:
      - 'docs/**'
      - 'openspec/**'
      - '**.md'

# A newer push to the same branch replaces the build still running for it.
concurrency:
  group: build-ios-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: macos-latest
    strategy:
      fail-fast: false
      matrix:
        variant: [release, development]
    env:
      APP_VARIANT: ${{ matrix.variant }}
      BUILD_NUMBER: ${{ github.run_number }}
    steps:
      - name: Decide whether this variant is wanted
        id: gate
        run: |
          # A manual run says what it wants; a tag builds both; a plain push only the app.
          wanted="${{ github.event.inputs.variant || (startsWith(github.ref, 'refs/tags/v') && 'both' || 'release') }}"
          if [ "$wanted" = "both" ] || [ "$wanted" = "${{ matrix.variant }}" ]; then
            echo "run=true" >> "$GITHUB_OUTPUT"
          else
            echo "run=false" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/checkout@v4
        if: steps.gate.outputs.run == 'true'

      - uses: maxim-lobanov/setup-xcode@v1
        if: steps.gate.outputs.run == 'true'
        with:
          xcode-version: latest-stable

      - uses: actions/setup-node@v4
        if: steps.gate.outputs.run == 'true'
        with:
          node-version: 22
          cache: npm

      - name: Set version from tag
        if: steps.gate.outputs.run == 'true' && startsWith(github.ref, 'refs/tags/v')
        run: echo "APP_VERSION=${GITHUB_REF_NAME#v}" >> "$GITHUB_ENV"

      - name: Install dependencies
        if: steps.gate.outputs.run == 'true'
        run: npm ci

      - name: Generate the native project
        if: steps.gate.outputs.run == 'true'
        run: npx expo prebuild --platform ios --clean

      - name: Archive without code signing
        if: steps.gate.outputs.run == 'true'
        run: |
          workspace=$(ls -d ios/*.xcworkspace | head -n 1)
          scheme=$(basename "$workspace" .xcworkspace)
          configuration=Release
          if [ "${{ matrix.variant }}" = "development" ]; then configuration=Debug; fi
          set -o pipefail
          xcodebuild \
            -workspace "$workspace" \
            -scheme "$scheme" \
            -configuration "$configuration" \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -archivePath "$RUNNER_TEMP/app.xcarchive" \
            archive \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            | tail -n 200

      - name: Package the .ipa
        if: steps.gate.outputs.run == 'true'
        run: |
          name=Closet
          if [ "${{ matrix.variant }}" = "development" ]; then name=Closet-Dev; fi
          mkdir -p "$RUNNER_TEMP/ipa/Payload"
          cp -R "$RUNNER_TEMP"/app.xcarchive/Products/Applications/*.app "$RUNNER_TEMP/ipa/Payload/"
          (cd "$RUNNER_TEMP/ipa" && zip -qry "$GITHUB_WORKSPACE/$name.ipa" Payload)
          ls -lh "$GITHUB_WORKSPACE/$name.ipa"
          echo "IPA_NAME=$name" >> "$GITHUB_ENV"

      - uses: actions/upload-artifact@v4
        if: steps.gate.outputs.run == 'true'
        with:
          name: ${{ env.IPA_NAME }}-${{ github.run_number }}
          path: ${{ env.IPA_NAME }}.ipa
          if-no-files-found: error
          retention-days: 14

  release:
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true
      - name: Write the AltStore source
        run: |
          node scripts/altstore-source.mjs \
            --ipa artifacts/Closet.ipa \
            --version "${GITHUB_REF_NAME#v}" \
            --build "${{ github.run_number }}" \
            --repo "${{ github.repository }}" \
            --tag "${GITHUB_REF_NAME}" \
            > artifacts/altstore-source.json
      - uses: softprops/action-gh-release@v2
        with:
          files: |
            artifacts/Closet.ipa
            artifacts/Closet-Dev.ipa
            artifacts/altstore-source.json
          generate_release_notes: true
